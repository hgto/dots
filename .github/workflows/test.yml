name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: |
          shellcheck -s sh \
            default/git-guard/hooks/_chain \
            default/git-guard/test/*.test.sh \
            test/run.sh

      - name: run tests
        run: sh test/run.sh
