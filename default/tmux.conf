# vi: ft=tmux tw=0 ts=2 sw=2 sts=2 fdm=marker fmr={{{,}}} et:

### Heads will roll {{{1
# Portably get the tmux version number
run-shell 'tmux setenv -g TMUX_VERSION $(tmux -V | sed "s:^.*\([0-9]\)\.\([0-9]\).*$:\\1\\2:");'

### Server Options {{{1

# we'll see if I regret this /20260615T2207Z
set-option -g mouse on
set-option -g focus-events on

# Fix escape key delay
set-option -gs escape-time 5

# tmux >= 2.6: copy to the *outer* terminal's clipboard via OSC 52 (works over SSH).
# Older tmux falls back to the xsel/pbcopy copy-pipe bindings further down.
if-shell "[ $TMUX_VERSION -ge 26 ]" \
  "set-option -g set-clipboard on"

# tmux >= 3.3: let apps (image protocols, some TUIs) punch escape sequences through tmux.
if-shell "[ $TMUX_VERSION -ge 33 ]" \
  "set-option -g allow-passthrough on"

### Session and Window Options {{{1
set-option -g mode-keys vi

# Allow the arrow key to be used immediately after changing windows
set-option -g repeat-time 0

# Window Numbering
set-option -g base-index 1
set-option -g pane-base-index 1
set-option -g renumber-windows on

# Keep detached sessions alive
set-option -g destroy-unattached off
set-option -g exit-unattached off
set-option -g detach-on-destroy on

# dynamic window title
set-option -g set-titles on
run-shell 'tmux set-option -g set-titles-string "$USER@${HOSTNAME:-$(hostname)} ##W" >/dev/null'
set-window-option -g automatic-rename on
set-window-option -g allow-rename off # Don't let escape sequences rename window

# Set window notifications
set-option -g visual-activity off

set-option -g history-limit 200000

# Window attention. The window-status-format already renders #{window_flags}
# natively at redraw time (! bell, ~ silence, # activity, * current, - last,
# Z zoomed) -- no shell, no watch script, ~zero cost. A flag only appears once
# its monitor is on and fires; bell is enabled here, so you'll see `!`.
# To also get `~`, add (tmux >= 2.6):
#   set-window-option -g monitor-silence  15   # `~` after 15s of no output
set-window-option -g monitor-activity on
set-option -g bell-action any
# `both` = show the tmux status message AND forward the BEL to the outer
# terminal (Ghostty) so its dock bounce / title / audio bell fire too.
# (`on` would swallow the bell and only show the tmux message.)
set-option -g visual-bell both
# monitor-bell is tmux >= 2.6; older tmux flags/rings via bell-action alone.
if-shell "[ $TMUX_VERSION -ge 26 ]" \
  "set-window-option -g monitor-bell on"
if-shell "[ $TMUX_VERSION -le 26 ]" \
  "set-option -g bell-on-alert on\;"

set-window-option -g xterm-keys off

# Terminal / colors {{{2
# Baseline TERM works on every tmux back to 1.6
set-option -g default-terminal "screen-256color"

# tmux >= 2.2: 24-bit truecolor passthrough (harmless on 3.2+ which also gets RGB below)
if-shell "[ $TMUX_VERSION -ge 22 ]" \
  "set-option -ga terminal-overrides ',*256col*:Tc'"

# tmux >= 3.2: richer terminfo (italics), modern RGB feature flag, + undercurl / colored underlines
if-shell "[ $TMUX_VERSION -ge 32 ]" \
  "set-option -g default-terminal 'tmux-256color' ; \
   set-option -ga terminal-features ',*:RGB' ; \
   set-option -ga terminal-overrides ',*:Smulx=\\E[4::%p1%dm' ; \
   set-option -ga terminal-overrides ',*:Setulc=\\E[58::2::%p1%{65536}%/%d::%p2%{256}%/%d::%p3%d%;m'"

if-shell "printenv ITERM_SESSION_ID >/dev/null 2>/dev/null" \
  "set-window-option -g aggressive-resize on\;"
# }}}2

set-window-option -g other-pane-height 25
set-window-option -g other-pane-width 80

set-window-option -g display-panes-time 1500

# environment
set-option -g update-environment "DISPLAY"
set-option -ag update-environment "SSH_ASKPASS"
set-option -ag update-environment "SSH_AUTH_SOCK"
set-option -ag update-environment "SSH_AGENT_PID"
set-option -ag update-environment "SSH_CONNECTION"
set-option -ag update-environment "WINDOWID"
set-option -ag update-environment "XAUTHORITY"
set-option -ag update-environment "DBUS_SESSION_BUS_ADDRESS"
set-option -ag update-environment "GPG_AGENT_INFO"
set-option -ag update-environment "GPG_TTY"

# Status  {{{2
# Theme-adaptive: only `default` (the terminal's fg/bg — follows Ghostty's
# light/dark auto-switch) and ANSI colour0-15 (redefined by Catppuccin /
# rose-pine). NEVER colour16-255: that ramp is fixed and ignores the theme.
set-option -g  status-style                 "fg=default,bg=default"
set-option -gw status-left-style            "fg=colour8,bg=default"
set-option -gw status-right-style           "fg=colour8,bg=default"

# inactive windows dim (gray); current window uses the theme accent + bold
set-option -g  window-status-style          "fg=colour8,bg=default"
set-option -g  window-status-current-style  "fg=colour4,bg=default,bold"

# attention: reverse blocks so they pop on light AND dark themes
set-option -g  window-status-activity-style "fg=colour0,bg=colour3,bold"
set-option -g  window-status-bell-style     "fg=colour0,bg=colour1,bold"

set-option -gw window-status-format         "#I#{?window_flags,#{window_flags}, }#W"
set-option -g  window-status-current-format "#I#F#W"

set-option -g  pane-active-border-style     "fg=colour4"
set-option -g  pane-border-style            "fg=colour8"

set-option -g  message-style                "fg=colour0,bg=colour3,bold"

set-option -g  display-panes-active-colour  colour4
set-option -g  display-panes-colour         colour8

set-option -g status-interval 15
set-option -g status-justify left
set-option -g status-left-length 40

set-option -g status-right '#{session_name}'
set-option -g status-right-length 20
run-shell 'tmux set-option -g status-left "$USER@${HOSTNAME:-$(hostname)}  " >/dev/null'

set-window-option -g clock-mode-colour colour2 # green (theme-adaptive)

### Keybindings {{{1

unbind-key C-b
unbind-key '#'
unbind-key '$'
unbind-key %
unbind-key -n %
unbind-key C-h
unbind-key -n C-h
unbind-key C-l
unbind-key -n C-l
unbind-key ]

set-option -g prefix C-a
bind-key    C-a send-prefix
bind-key    a   send-prefix
bind-key -n C-1 send-prefix

bind-key R display-message "reloading config" \; source-file ~/.tmux.conf
bind-key r refresh-client
bind-key '~' split-window -v -p 50 "htop -C || top"

# tmux >= 3.2: prefix g -> floating scratch shell at the current pane's path
if-shell "[ $TMUX_VERSION -ge 32 ]" \
  "bind-key g display-popup -E -w 80% -h 80% -d '#{pane_current_path}'"

bind-key e      set-option synchronize-panes
bind-key n      next-window
bind-key m      previous-window
bind-key C-o    rotate-window
bind-key BSpace clearhist

bind-key   v  split-window -h -c "#{pane_current_path}"
bind-key   s  split-window -v -c "#{pane_current_path}"
bind-key   c  new-window   -c "#{pane_current_path}"
bind-key   C  new-window
bind-key   l  select-pane  -L
bind-key   j  select-pane  -D
bind-key   k  select-pane  -U
bind-key   h  select-pane  -R

bind-key   C-l send-keys 'C-l' # allows prefix C-l for redraw
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -nr C-h if-shell "$is_vim" "send-keys C-h"  "select-pane -L"
bind-key -nr C-j if-shell "$is_vim" "send-keys C-j"  "select-pane -D"
bind-key -nr C-k if-shell "$is_vim" "send-keys C-k"  "select-pane -U"
bind-key -nr C-l if-shell "$is_vim" "send-keys C-l"  "select-pane -R"
bind-key -nr 'C-\' if-shell "$is_vim" "send-keys C-w\\" "select-window -l" 
bind-key '\' last-window \

bind-key [ copy-mode

bind-key o save-buffer /tmp/tmuxbuffer.out \; display-message 'saved to /tmp/tmuxbuffer.out'
bind-key p paste-buffer

if-shell "[ $TMUX_VERSION -le 24 ]" \
  " bind-key -t vi-copy v     begin-selection \;  \
    bind-key -t vi-copy C-v     rectangle-toggle \; \
    bind-key -t vi-copy y     copy-pipe          \"xsel -ib || reattach-to-user-namespace pbcopy\" \; \
    bind-key -t vi-copy Enter copy-pipe          \"xsel -ib || reattach pbcopy\" \; \
  " \
  " bind-key -T copy-mode-vi 'v'   send-keys -X begin-selection\;    \
    bind-key -T copy-mode-vi 'C-v'   send-keys -X rectangle-toggle\;   \
    bind-key -T copy-mode-vi 'y'   send-keys -X copy-pipe-and-cancel \"xsel -ib || reattach-to-user-namespace pbcopy\"\; \
    bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel \"xsel -ib || reattach-to-user-namespace pbcopy\"\; \
  "

