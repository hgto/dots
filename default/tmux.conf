### Plugins {{{1

# fzf-pane-switch: fuzzy pane/session switcher bound to prefix+f (prefix+s stays
# split-window). Needs tmux >= 3.3 and fzf >= 0.53 (--tmux), so it is gated on
# the version probe to keep this single config usable on ancient tmux.
# https://github.com/Kristijan/fzf-pane-switch.tmux
if-shell "[ $TMUX_VERSION -ge 33 ]" \
  "set-option -g @fzf_pane_switch_bind-key 'f'\; \
   run-shell ~/.tmux/plugins/fzf-pane-switch.tmux/select_pane.tmux"
