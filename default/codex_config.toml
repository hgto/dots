approvals_reviewer = "user"

[features]
apps = false

[tui.model_availability_nux]
"gpt-5.5" = 4

[plugins."slack@openai-curated"]
enabled = false

[plugins."codex-security@openai-curated"]
enabled = true

[plugins."github@openai-curated"]
enabled = false

[plugins."linear@openai-curated"]
enabled = false

[plugins."notion@openai-curated"]
enabled = false

[plugins."github@openai-curated-remote"]
enabled = false

[plugins."linear@openai-curated-remote"]
enabled = false

[plugins."notion@openai-curated-remote"]
enabled = false

[plugins."slack@openai-curated-remote"]
enabled = false

[mcp_servers.aws-mcp]
command = "uvx"
args = ["mcp-proxy-for-aws@latest", "https://aws-mcp.us-east-1.api.aws/mcp", "--metadata", "INSTALL_SOURCE=aws-cli"]

[mcp_servers.terraform-docs]
command = "docker"
args = ["run", "-i", "--rm", "hashicorp/terraform-mcp-server:latest"]

[mcp_servers.terragrunt-docs]
command = "uvx"
args = ["--from", "mcpdoc", "--with", "mcp<2", "mcpdoc", "--urls", "Terragrunt:https://docs.terragrunt.com/llms.txt", "--transport", "stdio"]

[mcp_servers.auth0-docs]
url = "https://auth0.com/docs/mcp"

[tui]
vim_mode_default = true

[tui.keymap.chat]
interrupt_turn = ["ctrl-c"]
